version: "3.9"

services:
  # ── FastAPI Backend ─────────────────────────────────────────
  api:
    build:
      context: .
      target: runtime
    container_name: grievance_api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://grievance:grievance@postgres:5432/grievance_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_ENDPOINT_URL: http://minio:9000
      AUDIO_TMP_DIR: /tmp/grievance_audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - /tmp/grievance_audio:/tmp/grievance_audio
    restart: unless-stopped
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --log-level info
      "

  # ── Celery Worker ───────────────────────────────────────────
  worker:
    build:
      context: .
      target: runtime
    container_name: grievance_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://grievance:grievance@postgres:5432/grievance_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_ENDPOINT_URL: http://minio:9000
      AUDIO_TMP_DIR: /tmp/grievance_audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /tmp/grievance_audio:/tmp/grievance_audio
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=celery

  # ── Celery Flower (monitoring UI) ───────────────────────────
  flower:
    build:
      context: .
      target: runtime
    container_name: grievance_flower
    ports:
      - "5555:5555"
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    command: celery -A app.workers.celery_app flower --port=5555

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: grievance_postgres
    environment:
      POSTGRES_USER: grievance
      POSTGRES_PASSWORD: grievance
      POSTGRES_DB: grievance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grievance -d grievance_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: grievance_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── MinIO (S3-compatible Object Storage) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: grievance_minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
